[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanta"
version = "0.1.0"
description = "Technical indicator and trading signal research toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.scripts]
hanta = "hanta.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
